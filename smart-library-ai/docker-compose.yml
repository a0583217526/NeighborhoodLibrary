version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: smart_library_db_container
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=smart_library_db
      - POSTGRES_USER=library_user
      - POSTGRES_PASSWORD=library_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: